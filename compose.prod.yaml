services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
    volumes:
      - symfony_var:/var/www/html/var
    restart: unless-stopped

  nginx:
    restart: unless-stopped
    volumes:
      - ./public:/var/www/html/public:ro
      - symfony_var:/var/www/html/var
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
    volumes:
      - symfony_var:/var/www/html/var
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
    volumes:
      - symfony_var:/var/www/html/var
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  rabbitmq:
    restart: unless-stopped

  elasticsearch:
    restart: unless-stopped
